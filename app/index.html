<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RompeCode Cloud Hub</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --accent:#3b82f6; --accent2:#22c55e;
    --text:#e5e9f2; --muted:#94a3b8; --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg),#0e1a2f);
    color:var(--text); min-height:100vh; padding:24px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:1.6rem;margin-bottom:4px;}
  .sub{color:var(--muted);margin-bottom:24px;}
  .card{
    background:var(--panel); border:1px solid #223050; border-radius:14px;
    padding:20px; margin-bottom:16px;
  }
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1c2a45;}
  .row:last-child{border-bottom:none;}
  .label{color:var(--muted);}
  .value{font-weight:600;}
  .badge{
    display:inline-block;padding:2px 10px;border-radius:999px;
    background:rgba(34,197,94,.15);color:var(--accent2);font-size:.85rem;
  }
  button{
    background:var(--danger);color:#fff;border:none;padding:12px 20px;
    border-radius:10px;font-size:1rem;cursor:pointer;width:100%;
  }
  button:disabled{opacity:.6;cursor:default;}
  .footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚀 RompeCode Cloud Hub</h1>
  <p class="sub">Aplicación Web de Alta Disponibilidad — Los Rompe Código</p>

  <div class="card">
    <div class="row"><span class="label">Instance ID</span><span class="value" id="instanceId">cargando...</span></div>
    <div class="row"><span class="label">Availability Zone</span><span class="value" id="az">cargando...</span></div>
    <div class="row"><span class="label">Estado</span><span class="badge">✔ Healthy</span></div>
    <div class="row"><span class="label">Versión desplegada</span><span class="value" id="version">v1.0.0</span></div>
  </div>

  <div class="card">
    <p class="label" style="margin-bottom:10px;">Prueba de Auto Scaling</p>
    <button id="stressBtn" onclick="stressCPU()">🔥 Iniciar Stress Test CPU (5 min)</button>
    <p id="stressStatus" class="sub" style="margin-top:10px;"></p>
  </div>

  <p class="footer">Equipo: Los Rompe Código · Refresca la página para ver el balanceo entre instancias</p>
</div>

<script>
async function loadInstanceMetadata() {
  try {
    const response = await fetch('/api/info');
    if (!response.ok) throw new Error('Metadatos no disponibles');
    const info = await response.json();
    document.getElementById('instanceId').textContent = info.instance_id;
    document.getElementById('az').textContent = info.az;
    document.getElementById('version').textContent = info.version;
  } catch {
    document.getElementById('instanceId').textContent = 'N/D';
    document.getElementById('az').textContent = 'N/D';
  }
}

async function stressCPU() {
  const button = document.getElementById('stressBtn');
  const status = document.getElementById('stressStatus');
  button.disabled = true;
  try {
    const response = await fetch('/api/stress', {method: 'POST', headers: {'X-RompeCode-Test': '1'}});
    status.textContent = response.status === 403
      ? 'Abre el portal mediante un túnel de SSM para iniciar la prueba.'
      : response.status === 202
        ? 'Carga iniciada por cinco minutos. Revisa CloudWatch.'
        : 'No se pudo iniciar la prueba. Revisa si ya hay una en curso.';
  } catch {
    status.textContent = 'No se pudo conectar con el servidor.';
  } finally {
    button.disabled = false;
  }
}
loadInstanceMetadata();
</script>
</body>
</html>
