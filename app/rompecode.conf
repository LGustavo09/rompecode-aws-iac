server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/rompecode;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/info {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/stress {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }
}
